<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>IDAROOM</title>
<style>
  :root {
    --orange: #ff6a1a;
    --orange-2: #ff9147;
    --brown: #6b3a1c;
    --ink: #0f1a14;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-user-select: none;
  }
  .stage {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 20% 0%, rgba(255,106,26,.35), transparent 60%),
      radial-gradient(100% 80% at 100% 100%, rgba(255,145,71,.25), transparent 60%),
      linear-gradient(160deg, #10221a 0%, #0b1410 60%, #08110d 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  /* Animated mesh */
  .mesh {
    position: absolute; inset: -30%;
    background:
      conic-gradient(from 210deg at 50% 50%,
        rgba(255,106,26,.18), rgba(255,145,71,.05),
        rgba(107,58,28,.15), rgba(255,106,26,.18));
    filter: blur(40px);
    animation: spin 18s linear infinite;
    opacity: .8;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Floating particles */
  .dot {
    position: absolute; width: 6px; height: 6px; border-radius: 999px;
    background: var(--orange); opacity: .55;
    box-shadow: 0 0 12px rgba(255,106,26,.9);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(20px) scale(.6); opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: translateY(-620px) scale(1.1); opacity: 0; }
  }

  .content {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 32px;
    text-align: center;
  }

  .logo-wrap {
    position: relative;
    width: 180px; height: 180px;
    display: grid; place-items: center;
    margin-bottom: 28px;
  }
  .halo {
    position: absolute; inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,106,26,.45), transparent 65%);
    filter: blur(18px);
    animation: pulse 2.6s ease-in-out infinite;
  }
  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(255,145,71,.55);
    animation: spin 12s linear infinite;
  }
  .ring.rev { border-style: dotted; inset: 14px; animation: spin 8s linear infinite reverse; opacity: .55; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity:.55 } 50% { transform: scale(1.12); opacity:.9 } }

  .logo {
    width: 130px; height: 130px; object-fit: contain;
    filter: drop-shadow(0 10px 30px rgba(255,106,26,.55));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

  .brand {
    font-family: "Segoe UI", sans-serif;
    font-size: 40px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #fff, #ffb98a 40%, #ff6a1a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0;
  }
  .tag {
    margin-top: 8px; font-size: 13px; color: #ffd9c0; opacity: .8;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .ar {
    margin-top: 14px; font-size: 15px; color: #eee; opacity: .75;
  }

  /* Loader — orbit of pulsing squares, not a bar */
  .orbit {
    margin-top: 34px;
    display: flex; gap: 10px; align-items: center;
  }
  .orbit i {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    background: var(--orange);
    box-shadow: 0 0 12px rgba(255,106,26,.7);
    animation: bounce 1.1s ease-in-out infinite;
  }
  .orbit i:nth-child(2) { animation-delay: .12s; background: var(--orange-2); }
  .orbit i:nth-child(3) { animation-delay: .24s; }
  .orbit i:nth-child(4) { animation-delay: .36s; background: var(--orange-2); }
  .orbit i:nth-child(5) { animation-delay: .48s; }
  @keyframes bounce {
    0%,100% { transform: translateY(0) scale(1); opacity: .5; }
    50%     { transform: translateY(-14px) scale(1.25); opacity: 1; }
  }

  .status {
    margin-top: 26px; font-size: 12px; color: #cfe0d6; opacity: .7;
    letter-spacing: 1.2px;
  }

  .foot {
    position: absolute; bottom: 18px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 22px;
    font-size: 11px; color: #8fa89a; opacity: .7;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="mesh"></div>

    <!-- particles -->
    <script>
      const stage = document.currentScript.parentElement;
      for (let i = 0; i < 22; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        d.style.left = Math.random() * 100 + '%';
        d.style.bottom = '-10px';
        d.style.animationDuration = (5 + Math.random() * 6) + 's';
        d.style.animationDelay = (Math.random() * 4) + 's';
        d.style.width = d.style.height = (3 + Math.random() * 5) + 'px';
        stage.appendChild(d);
      }
    </script>

    <div class="content">
      <div class="logo-wrap">
        <div class="halo"></div>
        <div class="ring"></div>
        <div class="ring rev"></div>
        <img class="logo" src="icon.png" alt="IDAROOM" />
      </div>

      <h1 class="brand">IDAROOM</h1>
      <div class="tag">Smart School OS</div>
      <div class="ar">إداروم — نظام إدارة مدرسية ذكي</div>

      <div class="orbit"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="status" id="s">جارٍ تهيئة الجلسة…</div>
    </div>

    <div class="foot">
      <span>v1.0.0</span>
      <span>© IDAROOM</span>
    </div>
  </div>

  <script>
    const messages = [
      "جارٍ تهيئة الجلسة…",
      "الاتصال بالسحابة…",
      "تحميل الواجهة…",
      "تجهيز البيانات المحلية…",
      "اللمسات الأخيرة…"
    ];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % messages.length;
      document.getElementById('s').textContent = messages[i];
    }, 900);
  </script>
</body>
</html>
